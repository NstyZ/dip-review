<!doctype html>

<title>数字图像处理 · 期末刷题站</title>
<link rel="stylesheet" href="assets/style.css">
<script>
(function(){try{var t=localStorage.getItem('dip-quiz-theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}else if(window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">DIP</div>
      <div>
        <div class="brand-title">数字图像处理</div>
        <div class="brand-sub">Final Review Lab</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-label">学习</div>
      <button class="nav-item" data-nav="home">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-7h6v7"/></svg>
        首页 <span class="count" id="navTotal">333</span>
      </button>
      <button class="nav-item" data-nav="random">
        <svg viewBox="0 0 24 24"><path d="M4 6h4l8 12h4"/><path d="m17 15 3 3-3 3"/><path d="M4 18h3c2 0 3-1 4-3"/><path d="M14 9c1-2 2-3 4-3h2"/><path d="m17 3 3 3-3 3"/></svg>

        设置

    </nav>
    <div class="sidebar-foot">
      <div class="mini-progress">
        <div class="row"><span>总进度</span><b id="sideProgressText">0 / 333</b></div>
        <div class="bar"><span id="sideProgressBar" style="width:0%"></span></div>
        <div class="row" style="margin:6px 0 0"><span>客观题正确率</span><b id="sideAccuracy">—</b></div>

  <div class="mobile-mask" id="mobileMask"></div>

          <input id="searchInput" type="search" placeholder="搜索题干、选项或答案…" autocomplete="off" aria-label="搜索题库">
          <kbd>/</kbd>

        <div class="search-pop" id="searchPop"></div>
      </div>
      <div class="top-actions">
        <button class="icon-btn hide-sm" id="helpBtn" title="快捷键" aria-label="快捷键">

        </button>
        <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
          <svg id="themeIcon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" title="设置" aria-label="设置">

    <div class="footer-note">数字图像处理 · 期末刷题站 · 共 333 题 ｜ 进度保存在本机浏览器</div>

<div class="toast" id="toast"></div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
